name: Build XStreaming Android 7.0 (API 24) APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant (prodRelease or prodDebug)
        required: true
        default: prodRelease
        type: choice
        options:
          - prodRelease
          - prodDebug
          - both
      abis:
        description: Target ABIs (arm64-v8a for ASUS P008, or armeabi-v7a,arm64-v8a)
        required: true
        default: armeabi-v7a,arm64-v8a
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (minSdk 24)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and Corepack
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'patches/*.patch') }}

      - name: Install JavaScript dependencies and apply patches
        run: corepack yarn install --immutable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK, NDK 23.1.7779620 & CMake 3.22.1
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-34
            build-tools;34.0.0
            ndk;23.1.7779620
            cmake;3.22.1

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Cache Rust cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nano-rs

      - name: Cache Gradle packages
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/23.1.7779620
          ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ inputs.abis || 'armeabi-v7a,arm64-v8a' }}
        run: |
          VARIANT="${{ inputs.variant || 'prodRelease' }}"
          if [ "$VARIANT" = "both" ]; then
            ./gradlew assembleProdDebug assembleProdRelease --no-daemon --stacktrace
          elif [ "$VARIANT" = "prodDebug" ]; then
            ./gradlew assembleProdDebug --no-daemon --stacktrace
          else
            ./gradlew assembleProdRelease --no-daemon --stacktrace
          fi

      - name: Upload built APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XStreaming-2.12.0-android7-api24-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
